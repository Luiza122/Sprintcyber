groups:
  - name: fordretain-security
    rules:
      - alert: FordRetainHigh5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.2
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Taxa elevada de HTTP 5xx na FordRetain API"
      - alert: FordRetainRepeatedAccessDenied
        expr: increase(fordretain_security_access_denied_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Volume anormal de 401/403"
      - alert: FordRetainRateLimitSpike
        expr: increase(fordretain_security_rate_limited_total[5m]) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pico de requisições bloqueadas por rate limit"
      - alert: FordRetainLoginFailures
        expr: increase(fordretain_security_login_total{result="failure"}[10m]) > 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Muitas falhas de login"
