apiVersion: apps/v1
kind: Deployment
metadata:
  name: fordretain-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fordretain-api
  template:
    metadata:
      labels:
        app: fordretain-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/matheus-bortolotto/fordretain-api-java:SEU_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "staging"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://staging.exemplo.com"
            - name: ORACLE_URL
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: oracle-url
            - name: ORACLE_USER
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: oracle-user
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: oracle-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: jwt-secret
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: crypto-secret
            - name: CRYPTO_SALT
              valueFrom:
                secretKeyRef:
                  name: fordretain-secrets
                  key: crypto-salt
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fordretain-api
spec:
  selector:
    app: fordretain-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
