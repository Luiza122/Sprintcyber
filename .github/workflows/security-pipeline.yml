name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e rodar testes
        run: mvn -B clean verify

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual
      - name: Build para análise SAST
        run: mvn -B clean compile -DskipTests
      - name: Analisar código
        uses: github/codeql-action/analyze@v3

  sca:
    name: SCA - Trivy FS + Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Relatório de dependências HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
      - name: Security gate - bloquear vulnerabilidade CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem Docker
        run: docker build -t fordretain-api:ci .
      - name: Relatório da imagem HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fordretain-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
      - name: Security gate - bloquear CRITICAL na imagem
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fordretain-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  security-gate:
    name: Gate final para deploy
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, sca, secret-scanning, container-security]
    steps:
      - name: Aprovar artefato para deploy
        run: echo "Todos os gates de segurança passaram. Artefato aprovado para o estágio de deploy."
