# Valores EXCLUSIVOS de teste/CI. Não são credenciais de produção.
jwt.secret=TEST_ONLY_FORDRETAIN_HS512_KEY_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijk
jwt.expiration=3600000
app.crypto.secret=TEST_ONLY_CRYPTO_SECRET_FOR_AUTOMATED_TESTS_ONLY_2026
app.crypto.salt=TEST_ONLY_CRYPTO_SALT_2026
app.cors.allowed-origins=http://localhost:3000
security.rate-limit.requests-per-minute=1000
security.rate-limit.login-requests-per-minute=1000
oracle.datasource.username=ci-test
oracle.datasource.password=ci-test
oracle.datasource.url=jdbc:h2:mem:fordretain-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
oracle.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=ci-test
spring.datasource.password=ci-test
spring.datasource.url=jdbc:h2:mem:fordretain-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
