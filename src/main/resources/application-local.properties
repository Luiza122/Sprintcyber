# Perfil exclusivo para demonstração local. Produção continua usando Oracle e secrets externos.
server.port=${SERVER_PORT:8080}

oracle.datasource.url=jdbc:h2:mem:fordretain;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
oracle.datasource.username=sa
oracle.datasource.password=
oracle.datasource.driver-class-name=org.h2.Driver

spring.datasource.url=jdbc:h2:mem:fordretain;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false

# Valores previsíveis e não produtivos para facilitar a apresentação local.
# Nunca ative este perfil em produção.
jwt.secret=${JWT_SECRET:LOCAL_ONLY_REPLACE_BEFORE_DEPLOY_LOCAL_ONLY_REPLACE_BEFORE_DEPLOY_2026}
app.crypto.secret=${CRYPTO_SECRET:LOCAL_ONLY_CRYPTO_SECRET}
app.crypto.salt=${CRYPTO_SALT:LOCAL_ONLY_CRYPTO_SALT}
