server.port=8080
server.forward-headers-strategy=framework

oracle.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
oracle.datasource.username=${ORACLE_USER}
oracle.datasource.password=${ORACLE_PASSWORD}
oracle.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.ford.fordretain=INFO
logging.level.org.springframework.web=INFO

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.crypto.secret=${CRYPTO_SECRET}
app.crypto.salt=${CRYPTO_SALT}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
security.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
security.rate-limit.login-requests-per-minute=${LOGIN_RATE_LIMIT_RPM:10}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=fordretain-api
